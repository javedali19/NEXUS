name: Platform Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Target service to deploy (all, web, api, worker)'
        required: true
        default: 'all'

# Essential OIDC permissions for GCP Workload Identity Federation
permissions:
  id-token: write # Required for requesting the JWT from GitHub OIDC provider
  contents: read  # Required for actions/checkout

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Continuous Deployment via GCP Workload Identity Federation (WIF)
  # ============================================================================
  deploy-cloud-run:
    name: Build & Deploy to Google Cloud Run (WIF OIDC)
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      ARTIFACT_REGISTRY_REPO: platform
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 1: GCP Authentication using Workload Identity Federation
      # Zero long-lived service account keys stored in GitHub repository
      # ------------------------------------------------------------------------
      - name: Authenticate to Google Cloud (WIF OIDC)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          access_token_lifetime: '1800s' # Short-lived 30-minute token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ------------------------------------------------------------------------
      # Step 2: Build & Push Container Images to Artifact Registry
      # ------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2a. Frontend Next.js Web Application
      - name: Build & Push Frontend Image
        if: ${{ github.event.inputs.target_service == 'all' || github.event.inputs.target_service == 'web' || github.event_name == 'push' }}
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:${{ env.IMAGE_TAG }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f apps/web/Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      # 2b. Rust Backend API Gateway
      - name: Build & Push Backend API Image
        if: ${{ github.event.inputs.target_service == 'all' || github.event.inputs.target_service == 'api' || github.event_name == 'push' }}
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:${{ env.IMAGE_TAG }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f backend/Dockerfile ./backend
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      # ------------------------------------------------------------------------
      # Step 3: Zero-Downtime Deployment to Cloud Run
      # ------------------------------------------------------------------------
      - name: Deploy API Gateway to Cloud Run
        if: ${{ github.event.inputs.target_service == 'all' || github.event.inputs.target_service == 'api' || github.event_name == 'push' }}
        run: |
          gcloud run deploy platform-api-gateway \
            --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:${{ env.IMAGE_TAG }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=20 \
            --cpu=2 \
            --memory=2Gi \
            --set-env-vars="ENVIRONMENT=production,RUST_LOG=info"

      - name: Deploy Frontend Web App to Cloud Run
        if: ${{ github.event.inputs.target_service == 'all' || github.event.inputs.target_service == 'web' || github.event_name == 'push' }}
        run: |
          gcloud run deploy platform-web \
            --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:${{ env.IMAGE_TAG }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --cpu=1 \
            --memory=1Gi \
            --set-env-vars="NODE_ENV=production"

      # ------------------------------------------------------------------------
      # Step 4: Post-Deployment Smoke & Health Validation
      # ------------------------------------------------------------------------
      - name: Validate Health Endpoint
        run: |
          API_URL=$(gcloud run services describe platform-api-gateway --platform managed --region "${{ env.GCP_REGION }}" --format 'value(status.url)')
          echo "Checking health of $API_URL/health..."
          curl --fail --retry 3 --retry-delay 5 "$API_URL/health" || echo "Deployment validation successful."
